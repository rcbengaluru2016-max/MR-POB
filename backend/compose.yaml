services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zenex
      POSTGRES_USER: zenex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored .env file}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenex -d zenex"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://zenex:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored .env file}@postgres:5432/zenex?schema=public&connection_limit=10&pool_timeout=10
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
